services:
  nexus:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # The browser reaches the API through the public domain.
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-https://trpgls.com/nexus/api/}
    image: nexus-admin:latest
    container_name: nexus-admin
    restart: unless-stopped
    ports:
      - "${NEXUS_PORT:-3002}:3002"
    environment:
      NODE_ENV: production
      PORT: 3002
      HOSTNAME: 0.0.0.0
