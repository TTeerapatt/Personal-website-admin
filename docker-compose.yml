services:
  personal-website-admin:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # The browser reaches the API through the public domain.
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-https://trpgls.com/personal-website/api/}
    image: personal-website-admin:latest
    container_name: personal-website-admin
    restart: unless-stopped
    ports:
      - "${PERSONAL_WEBSITE_ADMIN_PORT:-3002}:3002"
    environment:
      NODE_ENV: production
      PORT: 3002
      HOSTNAME: 0.0.0.0
