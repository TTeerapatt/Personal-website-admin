services:
  personal-website-admin:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Browser-facing API URL (baked at build time)
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:3006/personal-website/api/}
    image: personal-website-admin:latest
    container_name: personal-website-admin
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-3007}:3007"
    environment:
      NODE_ENV: production
      PORT: 3007
      HOSTNAME: 0.0.0.0
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||3007)+'/personal-website/admin').then((r)=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
